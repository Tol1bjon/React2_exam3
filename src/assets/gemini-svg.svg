             C 240 280 242 266 248 258 
             L 262 266 
             C 258 250 262 235 268 225 
             C 254 232 238 235 228 232 
             L 234 220 
             C 222 228 210 228 202 225 Z" fill="#ff3b00" />

    <!-- Декоративные черные зигзаги (текстура меха на свитере) -->
    <!-- Верхний левый зигзаг -->
    <path d="M 232 115 L 242 135 L 245 122 L 254 138" fill="none" stroke="#1f2421" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Нижний левый зигзаг (у ворота) -->
    <path d="M 218 202 L 222 184 L 228 198 L 236 185" fill="none" stroke="#1f2421" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Центральный изгиб (отделяет руку от спины) -->
    <path d="M 265 152 C 282 150 295 152 298 158 C 290 166 284 172 288 178 C 295 182 308 188 312 198" fill="none" stroke="#1f2421" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Зигзаг на рукаве -->
    <path d="M 295 210 L 312 222 L 298 228 L 310 242" fill="none" stroke="#1f2421" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>